<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>PortaChar - Operator Sign In</title>

	<!-- Global stylesheets -->
	<link href="assets/fonts/inter/inter.css" rel="stylesheet" type="text/css">
	<link href="assets/icons/phosphor/styles.min.css" rel="stylesheet" type="text/css">
	<link href="assets/css/all.min.css" id="stylesheet" rel="stylesheet" type="text/css">
	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
	<link href="assets/css/airselangor-theme.css" rel="stylesheet" type="text/css">
	<!-- /global stylesheets -->

	<!-- Core JS files -->
	<script src="assets/js/bootstrap/bootstrap.bundle.min.js"></script>
	<!-- /core JS files -->

	<!-- Theme JS files -->
	<script src="assets/js/app.js"></script>
	<script src="assets/js/auth.js"></script>
	<!-- /theme JS files -->

</head>

<body class="bg-dark">

	<!-- Page content -->
	<div class="page-content">

		<!-- Main content -->
		<div class="content-wrapper">

			<!-- Inner content -->
			<div class="content-inner">

				<!-- Content area -->
				<div class="content d-flex justify-content-center align-items-center py-5">

					<!-- Login card -->
					<form class="login-form" id="login_form" style="width: 25rem;">
						<div class="card mb-0 shadow-lg">
							<div class="card-body p-4">
								<div class="text-center mb-4">
									<div class="bg-teal bg-opacity-20 text-teal p-3 rounded-pill d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
										<i class="ph-drop-half fs-1"></i>
									</div>
									<h5 class="mb-0 fw-bold">Porta<span class="text-teal">Char</span><span class="text-info">.io</span></h5>
									<span class="d-block text-muted fs-sm">Telemetry &amp; Biochar Filtration Portal</span>
								</div>

								<!-- Alert box -->
								<div id="alert_box" class="alert alert-danger d-none py-2 px-3 fs-sm" role="alert">
									<i class="ph-warning-circle me-2"></i>
									<span id="alert_msg">Invalid credentials</span>
								</div>

								<div class="mb-3">
									<label class="form-label fw-semibold">Username</label>
									<div class="form-control-feedback form-control-feedback-start">
										<input type="text" id="username" class="form-control" placeholder="e.g. admin or operator" required autocomplete="username" autofocus>
										<div class="form-control-feedback-icon">
											<i class="ph-user"></i>
										</div>
									</div>
								</div>

								<div class="mb-3">
									<label class="form-label fw-semibold">Password</label>
									<div class="form-control-feedback form-control-feedback-start">
										<input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
										<div class="form-control-feedback-icon">
											<i class="ph-lock-key"></i>
										</div>
									</div>
								</div>

								<div class="d-flex align-items-center justify-content-between mb-3">
									<label class="form-check">
										<input type="checkbox" class="form-check-input" id="remember_me" checked>
										<span class="form-check-label fs-sm">Stay signed in</span>
									</label>
									<span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 fs-xs">
										SQLite3 Engine
									</span>
								</div>

								<div class="mb-3">
									<button type="submit" id="btn_submit" class="btn btn-teal w-100 rounded-pill py-2 fw-semibold">
										<i class="ph-sign-in me-2"></i> Sign In to Dashboard
									</button>
								</div>

								<!-- Seed Credentials Card -->
								<div class="card bg-light bg-opacity-10 border-0 p-3 mb-2">
									<div class="d-flex align-items-center justify-content-between mb-2">
										<span class="fs-xs fw-bold text-uppercase text-muted">
											<i class="ph-key me-1"></i> Quick Test Logins:
										</span>
										<span class="badge bg-success bg-opacity-20 text-success fs-xs">Active</span>
									</div>
									<div class="d-flex gap-2">
										<button type="button" class="btn btn-outline-light btn-sm flex-fill fs-xs py-1" onclick="fillCreds('admin', 'admin123')">
											<strong>admin</strong> / admin123
										</button>
										<button type="button" class="btn btn-outline-light btn-sm flex-fill fs-xs py-1" onclick="fillCreds('operator', 'operator123')">
											<strong>operator</strong> / operator123
										</button>
									</div>
								</div>

								<div class="text-center mt-3">
									<a href="index.html" class="text-muted text-decoration-none fs-xs">
										<i class="ph-arrow-left me-1"></i> Continue as Demo Guest
									</a>
								</div>
							</div>
						</div>
					</form>
					<!-- /login card -->

				</div>
				<!-- /content area -->

				<!-- Footer -->
				<div class="navbar navbar-sm navbar-footer border-top">
					<div class="container-fluid">
						<span>&copy; 2026 <a href="#">PortaChar Portable Biochar Filtration Systems</a> &bull; Powered by Limitless Bootstrap 5 Application Kit</span>
					</div>
				</div>
				<!-- /footer -->

			</div>
			<!-- /inner content -->

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->

	<script>
		function fillCreds(u, p) {
			document.getElementById('username').value = u;
			document.getElementById('password').value = p;
			document.getElementById('alert_box').classList.add('d-none');
		}

		document.getElementById('login_form').addEventListener('submit', function(e) {
			e.preventDefault();
			var u = document.getElementById('username').value.trim();
			var p = document.getElementById('password').value.trim();
			var alertBox = document.getElementById('alert_box');
			var alertMsg = document.getElementById('alert_msg');
			var btnSubmit = document.getElementById('btn_submit');

			if (!u || !p) {
				alertBox.classList.remove('d-none');
				alertMsg.textContent = 'Please enter both username and password';
				return;
			}

			btnSubmit.disabled = true;
			btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
			alertBox.classList.add('d-none');

			PortaCharAuth.login(u, p).then(function(res) {
				btnSubmit.disabled = false;
				btnSubmit.innerHTML = '<i class="ph-sign-in me-2"></i> Sign In to Dashboard';

				if (res.success) {
					alertBox.className = 'alert alert-success py-2 px-3 fs-sm';
					alertBox.innerHTML = '<i class="ph-check-circle me-2 fs-5"></i> Login successful! Redirecting...';
					alertBox.classList.remove('d-none');
					setTimeout(function() {
						window.location.href = 'index.html';
					}, 500);
				} else {
					alertBox.className = 'alert alert-danger py-2 px-3 fs-sm';
					alertBox.innerHTML = '<i class="ph-warning-circle me-2 fs-5"></i> ' + (res.error || 'Authentication failed');
					alertBox.classList.remove('d-none');
				}
			});
		});

		// Check if already authenticated
		document.addEventListener('DOMContentLoaded', function() {
			PortaCharAuth.checkAuth({ redirectToLogin: false }).then(function(res) {
				if (res && res.authenticated) {
					window.location.href = 'index.html';
				}
			});
		});
	</script>
</body>
</html>
